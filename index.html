<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habit Tracker — やめたい習慣を、記録で断ち切る</title>
  <meta name="description" content="やめたい習慣を断ってからの経過時間をリアルタイムで記録する、個人用の習慣トラッカー。データは端末内にのみ保存されます。">
  <meta name="theme-color" content="#0b1129">
  <meta name="color-scheme" content="dark">

  <!-- PWA / iOS -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habit">

  <link rel="preload" href="./fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/app.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb--violet"></span>
    <span class="orb orb--teal"></span>
  </div>

  <header class="app-header">
    <div class="app-header__brand">
      <img class="app-header__logo" src="./icons/icon-192.png" alt="" width="40" height="40">
      <div>
        <h1 class="app-header__title">Habit Tracker</h1>
        <p class="app-header__subtitle" id="header-summary">やめたい習慣を、記録で断ち切る</p>
      </div>
    </div>
  </header>

  <div class="install-hint" id="install-hint" hidden>
    <p class="install-hint__text" id="install-hint-text"></p>
    <div class="install-hint__actions">
      <button type="button" class="btn btn--primary btn--sm" id="install-hint-install" hidden>インストール</button>
      <button type="button" class="btn btn--ghost btn--sm" id="install-hint-close" aria-label="閉じる">閉じる</button>
    </div>
  </div>

  <main class="app-main">
    <section class="habit-grid" id="habit-grid" aria-label="習慣一覧"></section>

    <section class="empty-state glass" id="empty-state" hidden>
      <img class="empty-state__icon" src="./icons/icon-192.png" alt="" width="96" height="96">
      <h2 class="empty-state__title">最初の習慣を追加しましょう</h2>
      <p class="empty-state__text">やめたい習慣を登録すると、断ってからの時間が<br>リアルタイムで積み上がっていきます。</p>
      <button type="button" class="btn btn--primary" id="empty-add-button">＋ 習慣を追加</button>
    </section>
  </main>

  <button type="button" class="fab" id="fab-add" aria-label="習慣を追加">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <!-- 習慣の追加・編集 -->
  <dialog class="sheet" id="habit-dialog" aria-labelledby="habit-dialog-title">
    <form class="sheet__body" id="habit-form" method="dialog" novalidate>
      <div class="sheet__handle" aria-hidden="true"></div>
      <h2 class="sheet__title" id="habit-dialog-title">習慣を追加</h2>

      <div class="field" id="template-field">
        <span class="field__label">テンプレート</span>
        <div class="chip-row" id="template-list"></div>
      </div>

      <label class="field">
        <span class="field__label">やめたい習慣</span>
        <input class="input" type="text" name="title" id="habit-title" maxlength="30" placeholder="例: 間食、SNSの徘徊" required autocomplete="off">
        <span class="field__error" id="habit-title-error" hidden>名前を入力してください</span>
      </label>

      <fieldset class="field">
        <legend class="field__label">アイコン</legend>
        <div class="icon-grid" id="icon-list" role="radiogroup"></div>
      </fieldset>

      <label class="field">
        <span class="field__label">やめた日時</span>
        <input class="input" type="datetime-local" name="startedAt" id="habit-started-at" required>
        <span class="field__hint">過去の日時も指定できます</span>
        <span class="field__error" id="habit-started-at-error" hidden>未来の日時は指定できません</span>
      </label>

      <div class="sheet__actions">
        <button type="button" class="btn btn--danger-ghost" id="habit-delete" hidden>削除</button>
        <span class="sheet__spacer"></span>
        <button type="button" class="btn btn--ghost" id="habit-cancel">キャンセル</button>
        <button type="submit" class="btn btn--primary" id="habit-save">保存</button>
      </div>
    </form>
  </dialog>

  <!-- リセット確認 -->
  <dialog class="sheet" id="reset-dialog" aria-labelledby="reset-dialog-title">
    <form class="sheet__body" id="reset-form" method="dialog">
      <div class="sheet__handle" aria-hidden="true"></div>
      <h2 class="sheet__title" id="reset-dialog-title">リセットしますか？</h2>

      <div class="reset-summary glass">
        <span class="reset-summary__icon" id="reset-icon"></span>
        <div>
          <p class="reset-summary__title" id="reset-habit-title"></p>
          <p class="reset-summary__duration">今回の記録 <strong id="reset-duration"></strong></p>
        </div>
      </div>

      <label class="field">
        <span class="field__label">振り返りメモ（任意）</span>
        <textarea class="input input--textarea" id="reset-note" rows="3" maxlength="500" placeholder="何がきっかけでしたか？ そのときの気持ちは？"></textarea>
      </label>

      <p class="sheet__note">これまでの記録は履歴として残ります。ここからまた始めましょう。</p>

      <div class="sheet__actions">
        <span class="sheet__spacer"></span>
        <button type="button" class="btn btn--ghost" id="reset-cancel">キャンセル</button>
        <button type="submit" class="btn btn--danger" id="reset-confirm">リセットする</button>
      </div>
    </form>
  </dialog>

  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
</body>
</html>
